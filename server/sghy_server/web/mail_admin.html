<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>邮件发送台</title>
<style>
  :root{
    --bg:#16181d; --panel:#1e2128; --panel2:#252932; --line:#333845;
    --text:#e6e8ec; --dim:#8b92a3; --accent:#4c8dff; --ok:#3fb950; --warn:#d29922; --err:#f85149;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.55 "Microsoft YaHei",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;font-weight:600}
  header .tag{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  header .spacer{flex:1}
  .toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-80px);background:var(--panel2);border:1px solid var(--line);
         padding:10px 18px;border-radius:8px;font-size:13px;transition:.25s;z-index:99;pointer-events:none}
  .toast.show{transform:translate(-50%,0)}
  .toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--err)}
  main{flex:1;display:grid;grid-template-columns:320px 300px 1fr;gap:1px;background:var(--line);overflow:hidden}
  section{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  .sec-head{padding:10px 14px;font-size:13px;color:var(--dim);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .sec-body{flex:1;overflow-y:auto;padding:10px}
  input,textarea,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;
                        padding:8px 10px;font:inherit;outline:none;width:100%}
  input:focus,textarea:focus{border-color:var(--accent)}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px 14px;
         font:inherit;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{filter:brightness(1.1)}
  button.ghost{padding:4px 8px;font-size:12px;color:var(--dim)}
  .item{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:13px}
  .item:hover{background:var(--panel2)}
  .item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .meta{color:var(--dim);font-size:12px;white-space:nowrap}
  .q1{color:#9aa4b2}.q2{color:#3fb950}.q3{color:#4c8dff}.q4{color:#a371f7}.q5{color:#d29922}.q6{color:#f85149}
  .award{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
         border-radius:8px;padding:8px 10px;margin-bottom:8px}
  .award .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .award input[type=number]{width:76px;text-align:center;padding:4px 6px}
  .award .del{color:var(--err);cursor:pointer;font-size:16px;padding:0 4px;background:none;border:none}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .quick button{padding:5px 9px;font-size:12px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
  .row{display:flex;gap:10px}
  .row > *{flex:1}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:24px 0}
  .sent{font-size:12px;border-bottom:1px solid var(--line);padding:8px 4px}
  .sent .t{display:flex;justify-content:space-between;gap:8px}
  .sent .c{color:var(--dim);margin-top:2px}
  .badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
  .badge.ok{color:var(--ok);border-color:var(--ok)}
  .badge.no{color:var(--warn);border-color:var(--warn)}
  #composer{padding:14px;display:flex;flex-direction:column;min-height:0}
  #composer .grow{flex:1;display:flex;flex-direction:column;min-height:0}
  #content{flex:1;resize:none;min-height:80px}
  .foot{display:flex;gap:10px;align-items:center;margin-top:12px}
  .foot .hint{flex:1;font-size:12px;color:var(--dim)}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  /* 收件人选择弹层 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:80}
  .modal.show{display:flex}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:640px;max-height:76vh;
             display:flex;flex-direction:column;overflow:hidden}
  .modal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
  .modal-head .x{margin-left:auto;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
  .modal-body{flex:1;overflow-y:auto;padding:12px 16px}
  .modal-foot{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
  .grp{margin-bottom:10px}
  .grp-head{font-size:12px;color:var(--dim);padding:4px 2px}
  .pick{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
  .pick:hover{background:var(--panel2)}
  .pick input{width:auto;margin:0}
  .pick .lv{color:var(--dim);font-size:12px}
  .pick .cur{color:var(--ok);font-size:11px;border:1px solid var(--ok);border-radius:999px;padding:0 6px}
</style>
</head>
<body>
<header>
  <h1>邮件发送台</h1>
  <span class="tag">发件人：系统</span>
  <span class="tag">过期：30 天</span>
  <span class="spacer"></span>
  <span class="tag" id="stat">道具加载中…</span>
</header>

<div class="toast" id="toast"></div>

<main>
  <!-- 左：道具搜索 -->
  <section>
    <div class="sec-head" style="flex-direction:column;align-items:stretch;gap:8px">
      <div class="tabs" style="margin-bottom:0">
        <button id="tab-item" class="on" onclick="switchCat('item')">道具</button>
        <button id="tab-hero" onclick="switchCat('hero')">武将 4-6★</button>
        <button id="tab-equip" onclick="switchCat('equip')">装备 紫·神</button>
      </div>
      <input id="search" placeholder="搜索（名字 / ID）" autocomplete="off">
    </div>
    <div class="sec-body" id="itemList"><div class="empty">输入关键字搜索，或直接浏览</div></div>
  </section>

  <!-- 中：奖励篮 -->
  <section>
    <div class="sec-head">
      <span>附件奖励</span>
      <span class="spacer" style="flex:1"></span>
      <span id="awardCount" style="color:var(--dim)">0 项</span>
    </div>
    <div class="sec-body">
      <div id="awardList"><div class="empty">点左侧道具加入</div></div>
      <div class="quick">
        <button onclick="addProp('Dollar',100)">元宝 100</button>
        <button onclick="addProp('Dollar',1000)">元宝 1000</button>
        <button onclick="addProp('Coin',100000)">铜币 10万</button>
        <button onclick="addProp('Coin',1000000)">铜币 100万</button>
        <button onclick="addProp('Ep',50)">体力 50</button>
        <button onclick="addProp('Vigour',50)">精力 50</button>
        <button onclick="addQuickItem(20002,'改造石(洗练石)',10)">洗练石 10</button>
        <button onclick="addQuickItem(20002,'改造石(洗练石)',50)">洗练石 50</button>
      </div>
    </div>
  </section>

  <!-- 右：编辑 + 已发 -->
  <section>
    <div id="composer">
      <div class="field">
        <label>收件人</label>
        <div class="row" style="align-items:center">
          <select id="targetMode" onchange="onModeChange()">
            <option value="current">当前角色</option>
            <option value="all">全服所有角色</option>
            <option value="players">指定角色…</option>
          </select>
          <button class="ghost" id="pickBtn" onclick="openPicker()" style="display:none;flex:0 0 96px">选择角色</button>
        </div>
        <div id="targetInfo" style="font-size:12px;color:var(--dim);margin-top:6px">—</div>
      </div>
      <div class="field">
        <label>邮件标题</label>
        <input id="title" placeholder="例：维护补偿" maxlength="40">
      </div>
      <div class="field grow">
        <label>正文</label>
        <textarea id="content" placeholder="写点什么…（可留空）"></textarea>
      </div>
      <div class="foot">
        <span class="hint" id="hint">发给当前角色</span>
        <button onclick="resetAwards()" class="ghost">清空附件</button>
        <button class="primary" id="sendBtn" onclick="sendMail()">发送邮件</button>
      </div>
    </div>
    <div class="sec-head" style="border-top:1px solid var(--line)">
      <span>已发记录（当前角色）</span>
      <span style="flex:1"></span>
      <button class="ghost" onclick="loadSent()">刷新</button>
    </div>
    <div class="sec-body" id="sentList" style="max-height:34vh"><div class="empty">—</div></div>
  </section>
</main>

<div class="modal" id="picker">
  <div class="modal-box">
    <div class="modal-head">
      <b>选择收件人</b>
      <span class="tag" id="pickCount" style="font-size:12px;color:var(--dim)">已选 0</span>
      <button class="x" onclick="closePicker()">×</button>
    </div>
    <div class="modal-body">
      <input id="pickSearch" placeholder="搜索角色名 / 账号 / 角色 ID" oninput="renderPick()" style="margin-bottom:10px">
      <div id="pickList"><div class="empty">加载中…</div></div>
    </div>
    <div class="modal-foot">
      <button onclick="pickAll()">全选</button>
      <button onclick="pickNone()">清空</button>
      <span style="flex:1"></span>
      <button class="primary" onclick="closePicker()">确定</button>
    </div>
  </div>
</div>

<script>
// 管理令牌：/mail?token=xxx 打开后，所有 /api/mail 请求自动附带 token
const GM_TOKEN = new URLSearchParams(location.search).get('token') || '';
if (GM_TOKEN) {
  const _fetch = window.fetch.bind(window);
  window.fetch = (url, opts) => {
    if (typeof url === 'string' && url.startsWith('/api/')) {
      url += (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(GM_TOKEN);
    }
    return _fetch(url, opts);
  };
}
const TYPE_NAMES = {0:'公告', 1:'奖励', 2:'卡1', 3:'卡2'};
let catalog = [];
let awards = [];   // {kind, type|prop, count|value, name}

function toast(msg, ok){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (ok === false ? 'err' : 'ok');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 2600);
}

// ---------- 道具搜索 ----------
const CAT_NAMES = {item:'道具', hero:'武将', equip:'装备'};
let curCat = 'item';
function switchCat(c){
  curCat = c;
  for (const k of ['item','hero','equip']){
    document.getElementById('tab-' + k).className = (k === c) ? 'on' : '';
  }
  doSearch();
}
let searchTimer = null;
function debounceSearch(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 220);
}
async function doSearch(){
  const q = document.getElementById('search').value.trim();
  const r = await fetch('/api/mail/items?limit=100&cat=' + curCat + '&q=' + encodeURIComponent(q));
  const d = await r.json();
  catalog = d.items || [];
  document.getElementById('stat').textContent =
    q ? `${CAT_NAMES[curCat]} 匹配 ${d.total} 个` : `${CAT_NAMES[curCat]} ${d.total} 个`;
  renderItems();
}
// 品质色：道具按 Quality；武将按星级(4紫5金6红)；装备 4紫5金
function colorCls(it){
  if (curCat === 'hero') return 'q' + Math.min(Math.max(it.star||0,1),6);
  return 'q' + Math.min(Math.max(it.quality||0,1),6);
}
function metaText(it){
  if (curCat === 'hero') return (it.star||'?') + '★ · ' + it.id;
  if (curCat === 'equip') return (it.quality===5?'神':'紫') + ' ' + (it.star||'?') + '★ · ' + it.id;
  return it.id;
}
function renderItems(){
  const box = document.getElementById('itemList');
  if (!catalog.length){ box.innerHTML = '<div class="empty">没有匹配的项目</div>'; return; }
  box.innerHTML = catalog.map(it =>
    `<div class="item" onclick="addItem(${it.id})">
       <span class="nm ${colorCls(it)}">${escapeHtml(it.name)}${curCat!=='item' ? ' <span style="color:var(--dim);font-size:11px">'+(curCat==='hero'?(it.star+'★'):'')+'</span>' : ''}</span>
       <span class="meta">${metaText(it)}</span>
     </div>`).join('');
}

// ---------- 奖励篮 ----------
function awardCatOf(id){
  // 服务端 ID 段：武将 1xxxx / 装备 3xxxx / 其余道具
  if (id >= 10000 && id < 20000) return 'hero';
  if (id >= 30000 && id < 40000) return 'equip';
  return 'item';
}
function addItemObj(kind, id, count, name, cat){
  const hit = awards.find(a => a.kind === 'object' && a.type === id);
  if (hit){ hit.count += count; }
  else { awards.push({kind:'object', type:id, count, name, cat: cat || awardCatOf(id)}); }
  renderAwards();
}
function addItem(id){
  const it = catalog.find(x => x.id === id);
  if (!it) return;
  addItemObj('object', id, 1, it.name, curCat);
}
function addQuickItem(id, name, count){
  addItemObj('object', id, count, name, 'item');
}
function addProp(prop, value){
  const hit = awards.find(a => a.kind === 'property' && a.prop === prop);
  if (hit){ hit.value += value; }
  else { awards.push({kind:'property', prop, value, name: prop === 'Dollar' ? '元宝' : prop === 'Coin' ? '铜币' : prop}); }
  renderAwards();
}
function delAward(i){ awards.splice(i,1); renderAwards(); }
function resetAwards(){ awards = []; renderAwards(); }
function setCount(i, v){
  const a = awards[i];
  v = parseInt(v || '0', 10);
  if (a.kind === 'object') a.count = Math.max(1, v); else a.value = Math.max(1, v);
  renderAwards();
}
function renderAwards(){
  const box = document.getElementById('awardList');
  document.getElementById('awardCount').textContent = awards.length + ' 项';
  if (!awards.length){ box.innerHTML = '<div class="empty">点左侧道具加入</div>'; return; }
  box.innerHTML = awards.map((a,i) => {
    const val = a.kind === 'object' ? a.count : a.value;
    const tag = a.kind === 'object' ? (a.cat && CAT_NAMES[a.cat] ? CAT_NAMES[a.cat] : '道具') : '属性';
    const cls = a.kind === 'object' && a.cat && a.cat !== 'item' ? ' q' + (a.type >= 30000 ? 5 : Math.min(a.cat === 'hero' ? 6 : 5, 6)) : '';
    return `<div class="award">
      <span class="badge${cls}">${tag}</span>
      <span class="nm">${escapeHtml(a.name || '')}</span>
      <input type="number" min="1" value="${val}" onchange="setCount(${i}, this.value)">
      <button class="del" onclick="delAward(${i})">×</button>
    </div>`;
  }).join('');
}

// ---------- 收件人（多账号 / 多角色） ----------
let players = [];        // [{id,name,lv,vip,account,account_id}]
let activePid = 0;       // 当前活跃角色（服务端 store.player_id）
let picked = new Set();  // 选中的角色 id

async function loadPlayers(){
  try{
    const r = await fetch('/api/mail/players');
    const d = await r.json();
    players = d.players || [];
    activePid = d.active || 0;
  }catch(e){ players = []; }
  updateTargetInfo();
}

function onModeChange(){
  const m = document.getElementById('targetMode').value;
  document.getElementById('pickBtn').style.display = (m === 'players') ? '' : 'none';
  if (m === 'players' && !picked.size) picked.add(activePid);
  updateTargetInfo();
}

function targetLabel(){
  const m = document.getElementById('targetMode').value;
  if (m === 'all') return '全服所有角色（' + players.length + ' 个）';
  if (m === 'players') return picked.size ? ('指定 ' + picked.size + ' 个角色') : '还没选角色';
  const p = players.find(x => x.id === activePid);
  return '当前活跃角色' + (p ? ('：' + p.name + '（#' + p.id + '）') : '');
}

function updateTargetInfo(){
  const t = targetLabel();
  document.getElementById('targetInfo').textContent = t;
  document.getElementById('hint').textContent = '将发给：' + t;
}

function openPicker(){
  document.getElementById('picker').classList.add('show');
  renderPick();
}
function closePicker(){
  document.getElementById('picker').classList.remove('show');
  updateTargetInfo();
}

function renderPick(){
  const box = document.getElementById('pickList');
  if (!players.length){ box.innerHTML = '<div class="empty">没有角色</div>'; return; }
  const q = (document.getElementById('pickSearch').value || '').trim().toLowerCase();
  const groups = new Map();
  for (const p of players){
    const key = p.account || '(未归属账号)';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  }
  let html = '';
  for (const [acct, list] of groups){
    const hit = list.filter(p => !q || String(p.name||'').toLowerCase().includes(q)
                 || String(p.id).includes(q) || acct.toLowerCase().includes(q));
    if (!hit.length) continue;
    const allOn = hit.every(p => picked.has(p.id));
    html += '<div class="grp"><label class="grp-head" style="cursor:pointer;display:block">'
         + '<input type="checkbox" ' + (allOn?'checked':'') + ' onchange="pickGroup(this.dataset.g, this.checked)" data-g="' + escapeHtml(acct) + '"> '
         + escapeHtml(acct) + ' · ' + hit.length + ' 个角色</label>';
    html += hit.map(p => '<label class="pick">'
         + '<input type="checkbox" ' + (picked.has(p.id)?'checked':'') + ' onchange="pickOne(' + p.id + ', this.checked)">'
         + '<span>' + escapeHtml(p.name || ('#'+p.id)) + '</span>'
         + '<span class="lv">#' + p.id + ' · Lv.' + p.lv + (p.vip ? (' · VIP' + p.vip) : '') + '</span>'
         + (p.id === activePid ? '<span class="cur">当前</span>' : '')
         + '</label>').join('');
    html += '</div>';
  }
  box.innerHTML = html || '<div class="empty">没有匹配的角色</div>';
  document.getElementById('pickCount').textContent = '已选 ' + picked.size;
}

function pickGroup(acct, on){
  for (const p of players){
    if ((p.account || '(未归属账号)') === acct){
      if (on) picked.add(p.id); else picked.delete(p.id);
    }
  }
  renderPick(); updateTargetInfo();
}
function pickOne(id, on){
  if (on) picked.add(id); else picked.delete(id);
  renderPick(); updateTargetInfo();
}
function pickAll(){ players.forEach(p => picked.add(p.id)); renderPick(); updateTargetInfo(); }
function pickNone(){ picked.clear(); renderPick(); updateTargetInfo(); }

// ---------- 发送 ----------
async function sendMail(){
  const title = document.getElementById('title').value.trim();
  if (!title){ toast('标题不能为空', false); return; }
  if (!awards.length && !confirm('没有附件，只发一封纯文字邮件？')) return;
  const mode = document.getElementById('targetMode').value;
  let target = {mode};
  if (mode === 'players'){
    if (!picked.size){ toast('还没选收件人', false); return; }
    target = {mode:'players', ids:[...picked]};
  } else if (mode === 'all'){
    if (!confirm('确定发给全服 ' + players.length + ' 个角色？')) return;
  }
  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = '发送中…';
  try{
    const r = await fetch('/api/mail/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        title,
        content: document.getElementById('content').value,
        awards,
        target,
        expireDays: 30
      })
    });
    const d = await r.json();
    if (d.status){ toast(d.msg || '已发送'); resetAwards(); loadSent(); }
    else { toast(d.msg || '发送失败', false); }
  }catch(e){ toast('网络错误：' + e, false); }
  finally{ btn.disabled = false; btn.textContent = '发送邮件'; }
}

// ---------- 已发记录 ----------
async function loadSent(){
  const r = await fetch('/api/mail/sent');
  const d = await r.json();
  const box = document.getElementById('sentList');
  const items = d.items || [];
  if (!items.length){ box.innerHTML = '<div class="empty">还没有发过邮件</div>'; return; }
  box.innerHTML = items.map(m => {
    const t = new Date((m.sendTime||0)*1000);
    const ts = `${t.getMonth()+1}-${String(t.getDate()).padStart(2,'0')} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    const badge = m.claimed ? `<span class="badge ok">已领取</span>` : `<span class="badge no">未领取</span>`;
    const n = (m.award||[]).length;
    // 纯文本邮件的正文就是邮件本体，记录里必须能看到
    const body = String(m.content||'').trim();
    const bodyLine = body ? `<div class="c">正文：${escapeHtml(body.length>60?body.slice(0,60)+'…':body)}</div>` : '';
    return `<div class="sent">
      <div class="t"><b>#${m.id} ${escapeHtml(m.title)}</b>${badge}</div>
      <div class="c">${ts} · ${TYPE_NAMES[m.type]||m.type} · 附件 ${n} 项</div>
      ${bodyLine}
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('search').addEventListener('input', debounceSearch);
doSearch();
loadSent();
loadPlayers();
onModeChange();
</script>
